[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP server for TypeSafe Jev — typed, calibrated decisions as Claude Code tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anyio>=4.5",
    "click>=8.1",
    "mcp>=1.26,<2",
    "typesafe-sdk>=0.7.1,<0.8",
]

[project.scripts]
jev-mcp = "jev_mcp:main"
jev-guard = "jev_mcp.guard:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
